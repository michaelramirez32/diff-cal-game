<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="menu-page">

  <div id="bg"><div class="grid"></div></div>

  <main class="menu-main">
    <h1 id="title">Your Game</h1>

    <!-- Start in the center, How to play below it -->
    <nav class="menu" aria-label="Main menu">
      <button class="btn btn-start" id="btnStart" type="button">Start</button>
      <button class="btn btn-how" id="btnHow" type="button">How to play</button>
    </nav>
  </main>

  <!-- HOW TO PLAY window -->
  <div class="modal" id="howModal" role="dialog" aria-modal="true" aria-labelledby="howTitle" hidden>
    <div class="card">
      <h2 id="howTitle">How to play</h2>
      <ul id="howList"></ul>
      <button class="btn" id="btnClose" type="button">Got it</button>
    </div>
  </div>

<script src="config.js"></script>
<script src="menu.js"></script>
</body>
</html>
