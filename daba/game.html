<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

  <canvas id="game" aria-label="Game screen"></canvas>

  <!-- touch controls (only visible on phones/tablets) -->
  <div class="pad" aria-hidden="true">
    <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div><button data-k="jump">▲</button><button data-k="attack">⚔</button></div>
  </div>

  <!-- GAME OVER window -->
  <div class="modal" id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
    <div class="card">
      <h2 id="overTitle">Game over</h2>
      <p>Coins: <b id="finalCoins">0</b></p>
      <button class="btn" id="again" type="button">Play again</button>
      <a class="btn" href="menu.html">Menu</a>
    </div>
  </div>

<!-- MAP CLEARED window -->
  <div class="modal" id="clear" role="dialog" aria-modal="true" aria-labelledby="clearTitle" hidden>
    <div class="card">
      <h2 id="clearTitle">Map cleared!</h2>
      <p id="clearInfo"></p>
      <button class="btn" id="nextBtn" type="button">Next map</button>
      <a class="btn" href="menu.html">Menu</a>
    </div>
  </div>

<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
