<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>Calculus Adventure - Game</title>
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="pause.css">
  <style>
    html,body{
      margin:0;
      height:100%;
      height:100dvh;
      background:#12082b;
      overflow:hidden;
      font-family:'Press Start 2P',monospace;
      color:#fff
    }
    /* 16:9 game screen, centered, scaled to fit */
    #game{
      position:absolute;
      left:50%;
      top:50%;
      width:min(100vw,177.78vh);
      width:min(100dvw,177.78dvh);
      aspect-ratio:16/9;
      transform:translate(-50%,-50%);
      image-rendering:pixelated;
      background:#12082b;
      touch-action:none
    }
    /* the gear icon in the HUD is the pause button now */
    #ccPauseBtn{display:none !important}

    /* on-screen controls (only created on touch devices) */
    #touch{
      position:fixed;
      left:0;right:0;bottom:0;
      display:flex;
      justify-content:space-between;
      padding:0 max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
      z-index:50;
      pointer-events:none
    }
    #touch .grp{display:flex;gap:16px}
    #touch button{
      pointer-events:auto;
      width:74px;height:74px;
      border:3px solid #fff;
      border-radius:14px;
      background:rgba(20,10,50,.55);
      color:#fff;
      font:inherit;
      font-size:18px;
      touch-action:none
    }
    #touch button[data-k=jump]{width:120px;font-size:14px}
    #touch button.down{background:rgba(120,80,220,.75)}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="settings.js"></script>
  <script src="pause.js"></script>
  <script src="game.js"></script>
  <audio id="bgm" src="assets/game_theme.mp3" loop preload="auto"></audio>
</body>
<script>
  /* Start the menu music. Browsers block autoplay until the player interacts,
     so try right away and fall back to the first click / key / touch. */
  (function () {
    const bgm = document.getElementById('bgm');
 
    /* iPhone/iPad ignore audio.volume, so detect that and use a Web Audio gain node instead */
    bgm.volume = .5;
    const volumeWorks = bgm.volume === .5;
    let gain = null;
    const useGain = () => {
      if (volumeWorks || gain) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        gain = ctx.createGain();
        ctx.createMediaElementSource(bgm).connect(gain);
        gain.connect(ctx.destination);
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) {}
    };
 
    /* apply the Music slider + Mute toggle (runs now and every time a setting changes) */
    const applyVolume = () => {
      const v = CC.settings.mute ? 0 : CC.settings.music;
      bgm.muted = CC.settings.mute;
      if (volumeWorks) bgm.volume = v;
      else if (gain) gain.gain.value = v;
    };
    window.addEventListener('cc:settings', applyVolume);
    applyVolume();
 
    const events = ['pointerdown', 'keydown', 'touchstart'];
    const started = () => { useGain(); applyVolume(); };
    const unlock = () => {
      bgm.play().then(() => { started(); events.forEach(ev => removeEventListener(ev, unlock)); }).catch(() => {});
    };
    bgm.play().then(started).catch(() => events.forEach(ev => addEventListener(ev, unlock)));
  })();
</script>
</html>
